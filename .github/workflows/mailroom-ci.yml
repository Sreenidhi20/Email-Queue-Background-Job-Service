name: Mailroom CI

on:
  pull_request:
    branches: [main]
    paths:
      - "mailroom/**"
      - ".github/workflows/mailroom-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "mailroom/**"
      - ".github/workflows/mailroom-ci.yml"

defaults:
  run:
    working-directory: mailroom

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mailroom/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Migrations apply and roll back (SQLite)
        run: |
          alembic upgrade head
          alembic downgrade base
